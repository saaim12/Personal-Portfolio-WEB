<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <!-- Monogram mark: a white S that breathes, like a filament coming up and
       settling. Two things animate on the same 2.6s cycle so it reads as one
       light source rather than two effects: the stroke's opacity and the blur
       radius of the bloom behind it. Peak brightness lines up with peak bloom.

       Browser support is uneven and worth knowing: Firefox runs SMIL inside a
       favicon, Chrome and Edge rasterise a frame and leave it, and Safari does
       not accept SVG favicons at all. Everywhere that is not Firefox this is a
       static glowing S, which is why the resting attributes are the mid-bright
       values rather than the dim end of the cycle.

       The stroke is white, not the old #7c8cff: the site is monochrome now and
       the icon was the last thing still carrying a hue. -->
  <defs>
    <filter id="bloom" x="-75%" y="-75%" width="250%" height="250%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2.6" result="blur">
        <animate attributeName="stdDeviation"
                 values="1.4;4.4;1.4" dur="2.6s"
                 calcMode="spline" keyTimes="0;0.5;1"
                 keySplines="0.4 0 0.6 1;0.4 0 0.6 1"
                 repeatCount="indefinite"/>
      </feGaussianBlur>
      <feFlood flood-color="#ffffff" flood-opacity="0.9"/>
      <feComposite in2="blur" operator="in" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="64" height="64" rx="14" fill="#000000"/>
  <rect x="0.5" y="0.5" width="63" height="63" rx="13.5" fill="none"
        stroke="#ffffff" stroke-opacity="0.1"/>

  <!-- "S" as a stroked path so it stays crisp down to 16px -->
  <path d="M41 22c-2-2.9-5.2-4.4-9-4.4-5.5 0-9.2 2.8-9.2 7 0 3.7 2.7 5.7 8.5 6.9l1.7.3c6.1 1.3 9.1 3.5 9.1 7.8 0 4.8-4.2 7.9-10.4 7.9-4.4 0-8-1.7-10.1-4.7"
        fill="none" stroke="#ffffff" stroke-width="3.8" stroke-linecap="round"
        stroke-opacity="0.8" filter="url(#bloom)">
    <animate attributeName="stroke-opacity"
             values="0.55;1;0.55" dur="2.6s"
             calcMode="spline" keyTimes="0;0.5;1"
             keySplines="0.4 0 0.6 1;0.4 0 0.6 1"
             repeatCount="indefinite"/>
  </path>
</svg>
