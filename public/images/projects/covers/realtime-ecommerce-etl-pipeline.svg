<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img" aria-labelledby="title desc"><title id="title">STREAMING E-COMMERCE technical architecture</title><desc id="desc">Continuous ingestion; scheduled warehouse modeling. Order events to Apache Kafka to Spark Streaming to Bronze / Parquet. Apache Airflow to Silver layer to Gold model to PostgreSQL.</desc><defs><marker id="arrow" markerWidth="6" markerHeight="6" refX="4.5" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 Z" fill="#2a7785"/></marker><pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="#2a7785" stroke-opacity=".055"/></pattern></defs><rect width="800" height="450" fill="#dcebed"/><rect width="800" height="450" fill="url(#grid)"/><rect x="17" y="16" width="766" height="418" rx="17" fill="none" stroke="#2a7785" stroke-opacity=".25"/><text x="34" y="46" fill="#2a7785" font-family="Arial,Helvetica,sans-serif" font-size="10.5" font-weight="700" letter-spacing="2">ENGINEERING SYSTEM MAP / SAAIM</text><text x="34" y="79" fill="#1c2b30" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="800" letter-spacing="-.7">STREAMING E-COMMERCE</text><text x="34" y="99" fill="#41565d" font-family="Arial,Helvetica,sans-serif" font-size="12">Continuous ingestion; scheduled warehouse modeling</text><g font-family="Arial,Helvetica,sans-serif"><text x="34" y="131" fill="#2a7785" font-size="10.5" font-weight="700" letter-spacing="1.25">CONTINUOUS INGESTION</text><rect x="26" y="138" width="748" height="99" rx="14" fill="#ffffff" fill-opacity=".33"/><g><rect x="32" y="150" width="154" height="78" rx="11" fill="#ffffff" fill-opacity=".94" stroke="#2a7785" stroke-opacity=".29"/><rect x="33" y="162" width="4" height="54" rx="2" fill="#2a7785"/><text x="46" y="183" font-size="12" font-weight="700" fill="#243136">Order events</text><text x="46" y="205" font-size="10.5" fill="#52636a">Producer</text></g><g><rect x="226" y="150" width="154" height="78" rx="11" fill="#ffffff" fill-opacity=".94" stroke="#2a7785" stroke-opacity=".29"/><rect x="227" y="162" width="4" height="54" rx="2" fill="#2a7785"/><text x="240" y="183" font-size="12" font-weight="700" fill="#243136">Apache Kafka</text><text x="240" y="205" font-size="10.5" fill="#52636a">Event transport</text></g><g><rect x="420" y="150" width="154" height="78" rx="11" fill="#ffffff" fill-opacity=".94" stroke="#2a7785" stroke-opacity=".29"/><rect x="421" y="162" width="4" height="54" rx="2" fill="#2a7785"/><text x="434" y="183" font-size="12" font-weight="700" fill="#243136">Spark Streaming</text><text x="434" y="205" font-size="10.5" fill="#52636a">Checkpointed jobs</text></g><g><rect x="614" y="150" width="154" height="78" rx="11" fill="#ffffff" fill-opacity=".94" stroke="#2a7785" stroke-opacity=".29"/><rect x="615" y="162" width="4" height="54" rx="2" fill="#2a7785"/><text x="628" y="183" font-size="12" font-weight="700" fill="#243136">Bronze / Parquet</text><text x="628" y="205" font-size="10.5" fill="#52636a">Partitioned raw data</text></g><path d="M188 189 H218" stroke="#2a7785" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M382 189 H412" stroke="#2a7785" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M576 189 H606" stroke="#2a7785" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="34" y="270" fill="#2a7785" font-size="10.5" font-weight="700" letter-spacing="1.25">SCHEDULED TRANSFORMATION</text><rect x="26" y="278" width="748" height="99" rx="14" fill="#ffffff" fill-opacity=".33"/><g><rect x="32" y="289" width="154" height="78" rx="11" fill="#ffffff" fill-opacity=".94" stroke="#2a7785" stroke-opacity=".29"/><rect x="33" y="301" width="4" height="54" rx="2" fill="#2a7785"/><text x="46" y="322" font-size="12" font-weight="700" fill="#243136">Apache Airflow</text><text x="46" y="344" font-size="10.5" fill="#52636a">Hourly orchestration</text></g><g><rect x="226" y="289" width="15