<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img" aria-labelledby="title desc"><title id="title">TEMPORARY URL SERVICE technical architecture</title><desc id="desc">Short-lived redirects within a single Node.js process. POST /api/url to Express controller to Nano ID to In-memory Map. GET short link to Map lookup to HTTP redirect to Expiry timer.</desc><defs><marker id="arrow" markerWidth="6" markerHeight="6" refX="4.5" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 Z" fill="#55729a"/></marker><pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="#55729a" stroke-opacity=".055"/></pattern></defs><rect width="800" height="450" fill="#e5e7ef"/><rect width="800" height="450" fill="url(#grid)"/><rect x="17" y="16" width="766" height="418" rx="17" fill="none" stroke="#55729a" stroke-opacity=".25"/><text x="34" y="46" fill="#55729a" font-family="Arial,Helvetica,sans-serif" font-size="10.5" font-weight="700" letter-spacing="2">ENGINEERING SYSTEM MAP / SAAIM</text><text x="34" y="79" fill="#1c2b30" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="800" letter-spacing="-.7">TEMPORARY URL SERVICE</text><text x="34" y="99" fill="#41565d" font-family="Arial,Helvetica,sans-serif" font-size="12">Short-lived redirects within a single Node.js process</text><g font-family="Arial,Helvetica,sans-serif"><text x="34" y="131" fill="#55729a" font-size="10.5" font-weight="700" letter-spacing="1.25">SHORT LINK CREATION</text><rect x="26" y="138" width="748" height="99" rx="14" fill="#ffffff" fill-opacity=".33"/><g><rect x="32" y="150" width="154" height="78" rx="11" fill="#ffffff" fill-opacity=".94" stroke="#55729a" stroke-opacity=".29"/><rect x="33" y="162" width="4" height="54" rx="2" fill="#55729a"/><text x="46" y="183" font-size="12" font-weight="700" fill="#243136">POST /api/url</text><text x="46" y="205" font-size="10.5" fill="#52636a">Original address</text></g><g><rect x="226" y="150" width="154" height="78" rx="11" fill="#ffffff" fill-opacity=".94" stroke="#55729a" stroke-opacity=".29"/><rect x="227" y="162" width="4" height="54" rx="2" fill="#55729a"/><text x="240" y="183" font-size="12" font-weight="700" fill="#243136">Express controller</text><text x="240" y="205" font-size="10.5" fill="#52636a">Validate input</text></g><g><rect x="420" y="150" width="154" height="78" rx="11" fill="#ffffff" fill-opacity=".94" stroke="#55729a" stroke-opacity=".29"/><rect x="421" y="162" width="4" height="54" rx="2" fill="#55729a"/><text x="434" y="183" font-size="12" font-weight="700" fill="#243136">Nano ID</text><text x="434" y="205" font-size="10.5" fill="#52636a">Generate alias</text></g><g><rect x="614" y="150" width="154" height="78" rx="11" fill="#ffffff" fill-opacity=".94" stroke="#55729a" stroke-opacity=".29"/><rect x="615" y="162" width="4" height="54" rx="2" fill="#55729a"/><text x="628" y="183" font-size="12" font-weight="700" fill="#243136">In-memory Map</text><text x="628" y="205" font-size="10.5" fill="#52636a">Alias to target</text></g><path d="M188 189 H218" stroke="#55729a" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M382 189 H412" stroke="#55729a" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M576 189 H606" stroke="#55729a" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="34" y="270" fill="#55729a" font-size="10.5" font-weight="700" letter-spacing="1.25">REDIRECT / EXPIRATION</text><rect x="26" y="278" width="748" height="99" rx="14" fill="#ffffff" fill-opacity=".33"/><g><rect x="32" y="289" width="154" height="78" rx="11" fill="#ffffff" fill-opacity=".94" stroke="#55729a" stroke-opacity=".29"/><rect x="33" y="301" width="4" height="54" rx="2" fill="#55729a"/><text x="46" y="322" font-size="12" font-weight="700" fill="#243136">GET short link</text><text x="46" y="344" font-size="10.5" fill="#52636a">Alias request</text></g><g><rect x="226" y="289" width="154" height="78" rx="11" fill="#ffffff" fill-opacity=".94" stroke="#55729a" stroke-opacity=".29"/><rect x="227" y="301" width="4" height="54" rx="2" fill="#55729a"/><text x="240" y="322" font-size="12" font-weight="700" fill="#243136">Map lookup</text><text x="240" y="344" font-size="10.5" fill="#52636a">Resolve / 404</text></g><g><rect x="420" y="289" width="154" height="78" rx="11" fill="#ffffff" fill-opacity=".94" stroke="#55729a" stroke-opacity=".29"/><rect x="421" y="301" width="4" height="54" rx="2" fill="#55729a"/><text x="434" y="322" font-size="12" font-weight="700" fill="#243136">HTTP redirect</text><text x="434" y="344" font-size="10.5" fill="#52636a">Original URL</text></g><g><rect x="614" y="289" width="154" height="78" rx="11" fill="#ffffff" fill-opacity=".94" stroke="#55729a" stroke-opacity=".29"/><rect x="615" y="301" width="4" height="54" rx="2" fill="#55729a"/><text x="628" y="322" font-size="12" font-weight="700" fill="#243136">Expiry timer</text><text x="628" y="344" font-size="10.5" fill="#52636a">Delete alias</text></g><path d="M188 328 H218" stroke="#55729a" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M382 328 H412" stroke="#55729a" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M576 328 H606" stroke="#55729a" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="27" y="398" width="746" height="30" rx="8" fill="#55729a" fill-opacity=".10"/><text x="41" y="418" font-size="10.5" font-weight="700" letter-spacing=".8" fill="#354a50">NODE.JS   EXPRESS   NANO ID   MEMORY MAP</text></g></svg>