<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img" aria-labelledby="title desc"><title id="title">EDGE AUTOENCODER technical architecture</title><desc id="desc">Split model execution between device and backend. Sensor samples to TensorFlow to TFLite Micro to Decoder artifact. ESP32 to Latent values to Flask / EC2 to S3.</desc><defs><marker id="arrow" markerWidth="6" markerHeight="6" refX="4.5" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 Z" fill="#777e37"/></marker><pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="#777e37" stroke-opacity=".055"/></pattern></defs><rect width="800" height="450" fill="#e7e7d8"/><rect width="800" height="450" fill="url(#grid)"/><rect x="17" y="16" width="766" height="418" rx="17" fill="none" stroke="#777e37" stroke-opacity=".25"/><text x="34" y="46" fill="#777e37" font-family="Arial,Helvetica,sans-serif" font-size="10.5" font-weight="700" letter-spacing="2">ENGINEERING SYSTEM MAP / SAAIM</text><text x="34" y="79" fill="#1c2b30" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="800" letter-spacing="-.7">EDGE AUTOENCODER</text><text x="34" y="99" fill="#41565d" font-family="Arial,Helvetica,sans-serif" font-size="12">Split model execution between device and backend</text><g font-family="Arial,Helvetica,sans-serif"><text x="34" y="131" fill="#777e37" font-size="10.5" font-weight="700" letter-spacing="1.25">MODEL PREPARATION</text><rect x="26" y="138" width="748" height="99" rx="14" fill="#ffffff" fill-opacity=".33"/><g><rect x="32" y="150" width="154" height="78" rx="11" fill="#ffffff" fill-opacity=".94" stroke="#777e37" stroke-opacity=".29"/><rect x="33" y="162" width="4" height="54" rx="2" fill="#777e37"/><text x="46" y="183" font-size="12" font-weight="700" fill="#243136">Sensor samples</text><text x="46" y="205" font-size="10.5" fill="#52636a">Training input</text></g><g><rect x="226" y="150" width="154" hei