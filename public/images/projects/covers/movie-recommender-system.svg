<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img" aria-labelledby="title desc"><title id="title">HYBRID RECOMMENDER technical architecture</title><desc id="desc">Training artifacts separated from online inference. MovieLens to Feature building to Hybrid scoring to Model artifact. API-key request to FastAPI to Model reload to Redis (optional).</desc><defs><marker id="arrow" markerWidth="6" markerHeight="6" refX="4.5" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 Z" fill="#76609a"/></marker><pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="#76609a" stroke-opacity=".055"/></pattern></defs><rect width="800" height="450" fill="#e7e4ee"/><rect width="800" height="450" fill="url(#grid)"/><rect x="17" y="16" width="766" height="418" rx="17" fill="none" stroke="#76609a" stroke-opacity=".25"/><text x="34" y="46" fill="#76609a" font-family="Arial,Helvetica,sans-serif" font-size="10.5" font-weight="700" letter-spacing="2">ENGINEERING SYSTEM MAP / SAAIM</text><text x="34" y="79" fill="#1c2b30" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="800" letter-spacing="-.7">HYBRID RECOMMENDER</text><text x="34" y="99" fill="#41565d" font-family="Arial,Helvetica,sans-serif" font-size="12">Training artifacts separated from online inference</text><g font-family="Arial,Helvetica,sans-serif"><text x="34" y="131" fill="#76609a" font-size="10.5" font-weight="700" letter-spacing="1.25">OFFLINE MODEL TRAINING</text><rect x="26" y="138" width="748" height="99" rx="14" fill="#ffffff" fill-opacity=".33"/><g><rect x="32" y="150" width="154" height="78" rx="11" fill="#ffffff" fill-opacity=".94" stroke="#76609a" stroke-opacity=".29"/><rect x="33" y="162" width="4" height="54" rx="2" fill="#76609a"/><text x="46" y="183" font-size="12" font-weight="700" fill="#243136">MovieLens</text><text x="46" y="205" font-size="10.5" fill="#52636a">Ratings / metadata</text></g><g><rect