154" height="78" rx="11" fill="#ffffff" fill-opacity=".94" stroke="#76609a" stroke-opacity=".29"/><rect x="227" y="301" width="4" height="54" rx="2" fill="#76609a"/><text x="240" y="322" font-size="12" font-weight="700" fill="#243136">FastAPI</text><text x="240" y="344" font-size="10.5" fill="#52636a">Serving interface</text></g><g><rect x="420" y="289" width="154" height="78" rx="11" fill="#ffffff" fill-opacity=".94" stroke="#76609a" stroke-opacity=".29"/><rect x="421" y="301" width="4" height="54" rx="2" fill="#76609a"/><text x="434" y="322" font-size="12" font-weight="700" fill="#243136">Model reload</text><text x="434" y="344" font-size="10.5" fill="#52636a">Artifact swap</text></g><g><rect x="614" y="289" width="154" height="78" rx="11" fill="#ffffff" fill-opacity=".94" stroke="#76609a" stroke-opacity=".29"/><rect x="615" y="301" width="4" height="54" rx="2" fill="#76609a"/><text x="628" y="322" font-size="12" font-weight="700" fill="#243136">Redis (optional)</text><text x="628" y="344" font-size="10.5" fill="#52636a">Response cache</text></g><path d="M188 328 H218" stroke="#76609a" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M382 328 H412" stroke="#76609a" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M576 328 H606" stroke="#76609a" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="27" y="398" width="746" height="30" rx="8" fill="#76609a" fill-opacity=".10"/><text x="41" y="418" font-size="10.5" font-weight="700" letter-spacing=".8" fill="#354a50">PYTHON   FASTAPI   MOVIELENS   REDIS</text></g></svg>