<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img" aria-labelledby="title desc"><title id="title">ALGORITHMS &amp; DATA technical architecture</title><desc id="desc">A representative graph-shortest-path reasoning flow. Weighted graph to Priority queue to Pop candidate to Skip stale. Traverse edges to Relax distances to Push updates to Distance map.</desc><defs><marker id="arrow" markerWidth="6" markerHeight="6" refX="4.5" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 Z" fill="#936b46"/></marker><pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="#936b46" stroke-opacity=".055"/></pattern></defs><rect width="800" height="450" fill="#e9e3da"/><rect width="800" height="450" fill="url(#grid)"/><rect x="17" y="16" width="766" height="418" rx="17" fill="none" stroke="#936b46" stroke-opacity=".25"/><text x="34" y="46" fill="#936b46" font-family="Arial,Helvetica,sans-serif" font-size="10.5" font-weight="700" letter-spacing="2">ENGINEERING SYSTEM MAP / SAAIM</text><text x="34" y="79" fill="#1c2b30" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="800" letter-spacing="-.7">ALGORITHMS &amp; DATA</text><text x="34" y="99" fill="#41565d" font-family="Arial,Helvetica,sans-serif" font-size="12">A representative graph-shortest-path reasoning flow</text><g font-family="Arial,Helvetica,sans-serif"><text x="34" y="131" fill="#936b46" font-size="10.5" font-weight="700" letter-spacing="1.25">GRAPH PROCESSING</text><rect x="26" y="138" width="748" height="99" rx="14" fill="#ffffff" fill-opacity=".33"/><g><rect x="32" y="150" width="154" height="78" rx="11" fill="#ffffff" fill-opacity=".94" stroke="#936b46" stroke-opacity=".29"/><rect x="33" y="162" width="4" height="54" rx="2" fill="#936b46"/><text x="46" y="183" font-size="12" font-weight="700" fill="#243136">Weighted graph</text><text x="46" y="205" font-size="10.5" fill="#52636a">Adjacency list</text></g><g><rect x="226" y="150" width="154" height="78" rx="11" fill="#ffffff" fill-opacity=".94" stroke="#936b46" stroke-opacity=".29"/><rect x="227" y="162" width="4" height="54" rx="2" fill="#936b46"/><text x="240" y="183" font-size="12" font-weight="700" fill="#243136">Priority queue</text><text x="240" y="205" font-size="10.5" fill="#52636a">Minimum heap</text></g><g><rect x="420" y="150" width="154" height="78" rx="11" fill="#ffffff" fill-opacity=".94" stroke="#936b46" stroke-opacity=".29"/><rect x="421" y="162" width="4" height="54" rx="2" fill="#936b46"/><text x="434" y="183" font-size="12" font-weight="700" fill="#243136">Pop candidate</text><text x="434" y="205" font-size="10.5" fill="#52636a">Current distance</text></g><g><rect x="614" y="150" width="154" height="78" rx="11" fill="#ffffff" fill-opacity=".94" stroke="#936b46" stroke-opacity=".29"/><rect x="615" y="162" width="4" height="54" rx="2" fill="#936b46"/><text x="628" y="183" font-size="12" font-weight="700" fill="#243136">Skip stale</text><text x="628" y="205" font-size="10.5" fill="#52636a">Ignore old states</text></g><path d="M188 189 H218" stroke="#936b46" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M382 189 H412" stroke="#936b46" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M576 189 H606" stroke="#936b46" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="34" y="270" fill="#936b46" font-size="10.5" font-weight="700" letter-spacing="1.25">DIJKSTRA RELAXATION</text><rect x="26" y="278" width="748" height="99" rx="14" fill="#ffffff" fill-opacity=".33"/><g><rect x="32" y="289" width="154" height="78" rx="11" fill="#ffffff" fill-opacity=".94" stroke="#936b46" stroke-opacity=".29"/><rect x="33" y="301" width="4" height="54" rx="2" fill="#936b46"/><text x="46" y="322" font-size="12" font-weight="700" fill="#243136">Traverse edges</text><text x="46" y="344" font-size="10.5" fill="#52636a">Neighbor weights</text></g><g><rect x="226" y="289" width="154" height="78" rx="11" fill="#ffffff" fill-opacity=".94" stroke="#936b46" stroke-opacity=".29"/><rect x="227" y="301" width="4" height="54" rx="2" fill="#936b46"/><text x="240" y="322" font-size="12" font-weight="700" fill="#243136">Relax distances</text><text x="240" y="344" font-size="10.5" fill="#52636a">Best candidate</text></g><g><rect x="420" y="289" width="154" height="78" rx="11" fill="#ffffff" fill-opacity=".94" stroke="#936b46" stroke-opacity=".29"/><rect x="421" y="301" width="4" height="54" rx="2" fill="#936b46"/><text x="434" y="322" font-size="12" font-weight="700" fill="#243136">Push updates</text><text x="434" y="344" font-size="10.5" fill="#52636a">Queue improvement</text></g><g><rect x="614" y="289" width="154" height="78" rx="11" fill="#ffffff" fill-opacity=".94" stroke="#936b46" stroke-opacity=".29"/><rect x="615" y="301" width="4" height="54" rx="2" fill="#936b46"/><text x="628" y="322" font-size="12" font-weight="700" fill="#243136">Distance map</text><text x="628" y="344" font-size="10.5" fill="#52636a">Shortest paths</text></g><path d="M188 328 H218" stroke="#936b46" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M382 328 H412" stroke="#936b46" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M576 328 H606" stroke="#936b46" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="27" y="398" width="746" height="30" rx="8" fill="#936b46" fill-opacity=".10"/><text x="41" y="418" font-size="10.5" font-weight="700" letter-spacing=".8" fill="#354a50">PYTHON   JAVA   GRAPHS   COMPLEXITY</text></g></svg>